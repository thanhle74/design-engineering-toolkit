# Contract test gate (ADR-005-015). Validates both schema families + all examples/fixtures,
# runs the contract suite (T-01..T-22 #9 CLI/adapter/deny-list/determinism + G2-T23..T-28 #14
# design-source extraction: accountability, chrome exclusion, stable ids, negative graphs,
# scope escapes, plan-on-PageStructure, source neutrality) and the portability scans.
# npm test = tsc build + 65 checks. The task/issue prefix is never hardcoded here (spec §8).
# The task/issue prefix is never hardcoded here (spec §8): this workflow is issue-agnostic.
name: validate-contracts
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI invocation smoke (direct terminal, no agent)
        run: node bin/det.js --version
      - name: JSON parse sanity (all committed JSON)
        run: |
          find schemas examples profiles projects tests/fixtures -name '*.json' -print0 | while IFS= read -r -d '' f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" || exit 1
          done
