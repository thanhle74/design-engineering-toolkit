# Contract test gate (ADR-005-015). Validates both schema families + all resources/examples/fixtures,
# runs the contract suite (T-01..T-22 #9 CLI/adapter/deny-list/determinism + G2-T23..T-28 #14
# design-source extraction: accountability, chrome exclusion, stable ids, negative graphs,
# scope escapes, plan-on-PageStructure, source neutrality) the KB-01..KB-29 engine tests, and the portability scans.
# pnpm test = tsc core build + the contract suites (discovered module-owned at
# src/**/__tests__/*-suite.mjs by scripts/run-contract-tests.mjs, [68]) incl. the [63]
# foreign-cwd root path-resolution suite (ONE root package + ONE root lockfile; src/core and
# the feature modules src/modules/** with module-owned adapters are internal dirs — the [60]
# packed-@det/core artifact no longer exists and is deliberately not claimed).
# The task/issue prefix is never hardcoded here (spec §8): this workflow is issue-agnostic.
#
# The second job gates the Studio UI module (src/modules/studio + app/ — internal modules
# of the ONE root application since [63], installed by the same single root lockfile):
# full vitest suite + typecheck + lint + production build on the exact PR tip.
name: validate-contracts
on:
   push:
      branches: ["**"]
   pull_request:

jobs:
   contracts:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         # Installs the pnpm version pinned in package.json `packageManager`.
         - uses: pnpm/action-setup@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm
         # [63] one root install covers the whole single application (core + Studio module).
         - name: Install (single root lockfile)
           run: pnpm install --frozen-lockfile
         - run: pnpm test
         - name: CLI invocation smoke (direct terminal, no agent)
           run: node bin/det.js --version
         - name: JSON parse sanity (all committed JSON)
           run: |
              find resources src -name '*.json' -print0 | while IFS= read -r -d '' f; do
                node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" || exit 1
              done

   studio:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm
         # [63] single root pnpm install; pnpm run build = build:core (det CLI dist) + build:app (Next).
         - name: Install (single root lockfile)
           run: pnpm install --frozen-lockfile
         - name: Build (core det CLI dist + Studio production bundle)
           run: pnpm run build
           env:
              NEXT_TELEMETRY_DISABLED: 1
         # [40] the studio build-control tests drive the REAL det CLI — core dist exists after
         # the build above; the vitest suite covers real det-output interop + real det build E2E.
         - name: Tests (Studio vitest suite incl. real det-output interop + real det build E2E)
           run: pnpm run test:studio
         - name: Typecheck
           run: pnpm run typecheck
         - name: Lint
           run: pnpm run lint
